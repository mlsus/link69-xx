#bangbugs{
 --blue:#000090;
 --bg:#090a10;
 --card:#151722;
 --text:#f5f5f5;
 --muted:#999;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,sans-serif;
 width:100%;
 margin:0 auto;
 padding:12px;
 box-sizing:border-box;
}
#bangbugs *{box-sizing:border-box}
#bangbugs .head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:12px 5px 18px;
 border-bottom:1px solid #252638;
 margin-bottom:18px;
}
#bangbugs .logo{
 font-size:23px;
 font-weight:900;
 color:white;
}
#bangbugs .logo span{color:#6868ff}
#bangbugs .tag{
 background:var(--blue);
 padding:7px 12px;
 border-radius:5px;
 font-size:11px;
 font-weight:bold;
}
#bangbugs .section{
 font-size:17px;
 font-weight:bold;
 margin:12px 0 15px;
}
#bangbugs .videos{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:12px;
}
#bangbugs .mv-card{
 display:block;
 background:var(--card);
 color:white;
 text-decoration:none;
 overflow:hidden;
 border-radius:8px;
 border:1px solid #252638;
 min-width:0;
 transition:.2s;
}
#bangbugs .mv-card:hover{
 border-color:#5555ff;
 transform:translateY(-2px);
}
#bangbugs .mv-thumb{
 position:relative;
 aspect-ratio:16/9;
 background:#202130;
 overflow:hidden;
}
#bangbugs .mv-thumb img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
}
#bangbugs .mv-quality{
 position:absolute;
 right:6px;
 bottom:6px;
 background:#000090;
 color:white;
 padding:4px 6px;
 border-radius:3px;
 font-size:10px;
 font-weight:bold;
}
#bangbugs .mv-title{
 font-size:12px;
 line-height:1.45;
 font-weight:bold;
 padding:9px 9px 5px;
 display:-webkit-box;
 -webkit-line-clamp:2;
 -webkit-box-orient:vertical;
 overflow:hidden;
}
#bangbugs .mv-info{
 display:flex;
 align-items:center;
 gap:7px;
 flex-wrap:wrap;
 padding:3px 9px 10px;
 font-size:10px;
 color:var(--muted);
}
#bangbugs .mv-info span{color:#9999ff}
#bangbugs .mv-info b{
 margin-left:auto;
 color:#ddd;
 font-weight:normal;
}
#bangbugs .mv-next-wrap{
 text-align:center;
 padding:25px 0 15px;
}
#bangbugs .mv-next{
 display:inline-block;
 background:var(--blue);
 color:white;
 text-decoration:none;
 padding:12px 35px;
 border-radius:5px;
 font-size:13px;
 font-weight:bold;
}
#bangbugs .footer{
 text-align:center;
 color:#777;
 font-size:11px;
 border-top:1px solid #252638;
 padding:18px 5px;
 margin-top:15px;
}
@media(max-width:700px){
 #bangbugs .videos{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 #bangbugs{padding:9px}
 #bangbugs .mv-title{font-size:11px;padding:7px}
 #bangbugs .mv-info{padding:3px 7px 8px}
}
@media(min-width:1100px){
 #bangbugs .videos{grid-template-columns:repeat(5,minmax(0,1fr))}
}
</style>
