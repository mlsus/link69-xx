<style>
#bangbugs-site{
--p:#000090;
font-family:Arial,sans-serif;
background:#f5f6ff;
color:#17172c;
max-width:1100px;
width:100%;
margin:auto;
overflow:hidden;
isolation:isolate;
}
#bangbugs-site *{box-sizing:border-box}
#bangbugs-site button{font-family:inherit;cursor:pointer}
#bangbugs-site .head{
background:linear-gradient(120deg,#000050,#1717c5);
display:flex;align-items:center;justify-content:space-between;
}
#bangbugs-site .btn{
background:#ffffff20;color:white;
border:1px solid #ffffff40;
border-radius:8px;padding:11px;
}
#bangbugs-site .brand{text-align:center;flex:1}
#bangbugs-site .brand b{
font-size:29px;font-weight:900;
background:linear-gradient(90deg,#fff,#ffd34d,#ff68c5,#65eaff);
-webkit-background-clip:text;background-clip:text;color:transparent;
}
#bangbugs-site .brand small{display:block;color:#ddd;font-size:10px}
#bangbugs-site .nav{display:flex;background:#000075}
#bangbugs-site .nav button{
flex:1;border:0;background:none;color:white;padding:15px 3px;font-size:18px;
}
#bangbugs-site .nav button:hover{background:#2929c8;color:#ffe16a}
#bangbugs-site .menu{
display:none;background:#08085e;padding:10px;
grid-template-columns:repeat(2,1fr);gap:8px;
}
#bangbugs-site .menu.show{display:grid}
#bangbugs-site .menu button{
background:#ffffff18;color:white;border:0;padding:12px;
text-align:left;border-radius:6px;
}
#bangbugs-site .search{display:none;padding:10px;background:#e9eaff}
#bangbugs-site .search.show{display:block}
#bangbugs-site .search input{
width:100%;padding:12px;border:1px solid #bbb;border-radius:7px;outline:none;
}
#bangbugs-site .content{padding:15px}
#bangbugs-site .heading{
background:white;border-left:4px solid var(--p);padding:12px;margin-bottom:13px;
display:flex;justify-content:space-between;align-items:center;
color:var(--p);font-weight:bold;
}
#bangbugs-site .heading span{font-size:11px;color:#777;font-weight:normal}
#bangbugs-site .gallery{
display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;
gap:15px 10px;width:100%;
}
#bangbugs-site .card{
display:block!important;width:100%!important;min-width:0!important;
background:white!important;border:1px solid #e0e0f5!important;
border-radius:8px!important;overflow:hidden!important;cursor:pointer;
margin:0!important;padding:0!important;box-shadow:none!important;
}
#bangbugs-site .thumb{
display:block!important;position:relative!important;width:100%!important;
height:auto!important;aspect-ratio:1.48/1!important;overflow:hidden!important;
background:#ddd!important;margin:0!important;padding:0!important;
}
#bangbugs-site .thumb img{
display:block!important;width:100%!important;max-width:none!important;
min-width:100%!important;height:100%!important;max-height:none!important;
object-fit:cover!important;margin:0!important;padding:0!important;
border:0!important;float:none!important;
}
#bangbugs-site .quality{
position:absolute;right:6px;top:6px;background:var(--p);color:white;
padding:4px 6px;border-radius:4px;font-size:10px;
}
#bangbugs-site .play{
position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
background:#000090cf;color:white;border:2px solid white;border-radius:50%;
width:38px;height:38px;display:grid;place-items:center;z-index:2;
}
#bangbugs-site .title{
display:block!important;width:auto!important;font-size:12px!important;
font-weight:bold!important;line-height:1.5!important;margin:9px!important;
padding:0!important;color:#111!important;
}
#bangbugs-site .info{
display:flex!important;justify-content:space-between!important;align-items:center;
gap:4px;margin:0 9px 10px!important;font-size:10px!important;
}
#bangbugs-site .author{
color:var(--p);font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#bangbugs-site .details{color:#777;white-space:nowrap}
#bangbugs-site .empty{grid-column:1/-1;text-align:center;padding:25px;background:white}
#bangbugs-site .next{
width:100%;padding:14px;margin-top:22px;
background:linear-gradient(120deg,#000060,#0000b5);
border:0;border-radius:8px;color:white;font-weight:bold;
}
#bangbugs-site .foot{background:#000050;color:#ddd;text-align:center;padding:20px;font-size:12px}
#bangbugs-site .foot b{font-size:18px;color:white}
@media(max-width:800px){
#bangbugs-site .gallery{grid-template-columns:repeat(3,minmax(0,1fr))!important}
}
@media(max-width:550px){
#bangbugs-site .gallery{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px 8px}
#bangbugs-site .content{padding:9px}
#bangbugs-site .thumb{aspect-ratio:1.35/1!important}
#bangbugs-site .brand b{font-size:24px}
#bangbugs-site .nav button{font-size:16px}
}
</style>
